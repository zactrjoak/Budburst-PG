<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Outreach Engine | Budburst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #EBEBE0; color: #07201B; min-height: 100vh; }
  :root {
    --forest:   #07201B;
    --deep:     #225E4C;
    --accent:   #85D96D;
    --mint:     #D4F0CF;
    --sand:     #EBEBE0;
    --charcoal: #33312A;
    --sage:     #597967;
    --stone:    #AEB1A5;
    --warm-white: #F8FAF6;
    --border:   rgba(7,32,27,0.12);
    --border-strong: rgba(7,32,27,0.25);
    --red: #991b1b; --red-light: #fee2e2;
    --amber: #7a4f0d; --amber-light: #fef3c7;
  }

  /* Top bar */
  .topbar { background: var(--forest); padding: 0.6rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  .topbar-logo { font-family: 'DM Serif Display', serif; font-size: 15px; color: var(--accent); letter-spacing: 0.02em; }
  .topbar-powered { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); display: flex; align-items: center; gap: 6px; }
  .topbar-powered::before { content: ''; width: 16px; height: 1px; background: var(--sage); display: inline-block; }

  .app { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

  .header { padding-bottom: 1.75rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border-strong); display: flex; justify-content: space-between; align-items: flex-end; }
  .header-left { }
  .header-eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); margin-bottom: 0.4rem; font-weight: 400; }
  .header-title { font-family: 'DM Serif Display', serif; font-size: 36px; font-weight: normal; line-height: 1.1; color: var(--forest); }
  .header-title em { font-style: italic; color: var(--deep); }
  .header-sub { font-size: 14px; color: var(--sage); margin-top: 0.6rem; line-height: 1.6; font-weight: 300; max-width: 460px; }

  .step-indicator { display: flex; align-items: center; margin-bottom: 2.5rem; }
  .step-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .step-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'DM Sans', sans-serif; color: var(--sage); background: var(--warm-white); flex-shrink: 0; font-weight: 500; }
  .step-dot.active { background: var(--forest); color: var(--accent); border-color: var(--forest); }
  .step-dot.done { background: var(--accent); color: var(--forest); border-color: var(--accent); font-weight: 500; }
  .step-line { flex: 1; height: 1px; background: var(--border); }
  .step-label { font-size: 10px; color: var(--stone); text-align: center; max-width: 70px; line-height: 1.3; font-weight: 400; }
  .step-label.active { color: var(--forest); font-weight: 500; }

  .section { background: var(--warm-white); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .section-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .section-title::before { content: ''; width: 14px; height: 1.5px; background: var(--accent); display: inline-block; border-radius: 2px; }
  .required-badge { font-size: 10px; background: var(--red-light); color: var(--red); padding: 2px 6px; border-radius: 3px; letter-spacing: 0.05em; text-transform: uppercase; }

  label { display: block; font-size: 13px; color: var(--charcoal); margin-bottom: 6px; line-height: 1.4; font-weight: 400; }
  .hint { display: block; font-size: 11px; color: var(--stone); margin-top: 2px; font-style: italic; }

  input[type="text"], input[type="url"], textarea, select {
    width: 100%; border: 0.5px solid var(--border-strong); border-radius: 5px;
    padding: 8px 11px; font-size: 13px; font-family: 'DM Sans', sans-serif;
    background: white; color: var(--forest); outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--deep); box-shadow: 0 0 0 3px rgba(34,94,76,0.1); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .file-upload { border: 1.5px dashed var(--border-strong); border-radius: 5px; padding: 0.875rem 1rem; text-align: center; background: var(--sand); cursor: pointer; transition: all 0.15s; }
  .file-upload:hover { border-color: var(--deep); background: var(--mint); }
  .file-upload input { display: none; }
  .file-upload-lbl { font-size: 12px; color: var(--stone); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .file-upload.loaded { border-color: var(--deep); background: var(--mint); border-style: solid; }
  .file-upload.loaded .file-upload-lbl { color: var(--deep); font-weight: 500; }

  .linkedin-block { border: 0.5px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
  .linkedin-tabs { display: flex; border-bottom: 0.5px solid var(--border); }
  .li-tab { flex: 1; padding: 7px 12px; font-size: 11px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; border: none; background: var(--sand); color: var(--stone); cursor: pointer; border-right: 0.5px solid var(--border); transition: all 0.15s; font-weight: 400; }
  .li-tab:last-child { border-right: none; }
  .li-tab.active { background: white; color: var(--forest); font-weight: 500; }
  .li-tab:hover { color: var(--forest); }
  .li-tab-body { padding: 0.875rem; background: white; }
  .li-tab-body.loaded { background: var(--mint); }
  .loaded-indicator { font-size: 11px; color: var(--deep); display: flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 500; }

  .field-group { margin-bottom: 1.25rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .account-block { border: 0.5px solid var(--border-strong); border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
  .acct-header { background: var(--forest); color: white; padding: 0.8rem 1.1rem; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .acct-header-name { color: var(--accent); font-weight: 400; }
  .acct-body { padding: 1.25rem; background: var(--warm-white); }

  .prospect-block { border: 0.5px solid var(--border); border-radius: 6px; padding: 1rem; margin-top: 1rem; background: var(--sand); }
  .prospect-hdr { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 1rem; font-weight: 500; }

  .btn { padding: 10px 20px; border-radius: 5px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px; font-weight: 400; transition: all 0.15s; }
  .btn-primary { background: var(--forest); color: var(--accent); border-color: var(--forest); font-weight: 500; }
  .btn-primary:hover { background: var(--deep); border-color: var(--deep); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--forest); border-color: var(--border-strong); }
  .btn-secondary:hover { background: var(--mint); border-color: var(--deep); }
  .btn-copy { background: transparent; color: var(--sage); border-color: var(--border); font-size: 11px; padding: 4px 10px; }
  .btn-copy:hover { background: var(--mint); color: var(--deep); }
  .btn-export { background: var(--accent); color: var(--forest); border-color: var(--accent); font-weight: 500; }
  .btn-export:hover { background: #6dc857; border-color: #6dc857; }
  .btn-clear { background: transparent; color: var(--red); border: 0.5px solid var(--red-light); font-size: 11px; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 6px; }
  .btn-clear:hover { background: var(--red-light); }
  .btn-row { display: flex; gap: 1rem; align-items: center; margin-top: 2rem; flex-wrap: wrap; }

  .gate-warn { background: var(--amber-light); border: 0.5px solid rgba(122,79,13,0.3); border-radius: 5px; padding: 0.75rem 1rem; font-size: 12px; color: var(--amber); margin-bottom: 1rem; line-height: 1.6; }
  .error-block { background: var(--red-light); border: 0.5px solid rgba(153,27,27,0.3); border-radius: 5px; padding: 0.75rem 1rem; font-size: 12px; color: var(--red); margin-bottom: 1rem; line-height: 1.5; }

  .nav-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .nav-tab { padding: 8px 18px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: none; background: none; cursor: pointer; color: var(--stone); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-weight: 400; }
  .nav-tab.active { color: var(--forest); border-bottom-color: var(--accent); font-weight: 500; }
  .nav-tab:hover { color: var(--forest); }
  .progress-screen { text-align: center; padding: 4rem 2rem; }
  .progress-steps { list-style: none; max-width: 320px; margin: 0 auto 2rem; text-align: left; }
  .progress-steps li { font-size: 13px; color: var(--sage); padding: 6px 0; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; }
  .progress-steps li.active { color: var(--forest); font-weight: 500; }
  .progress-steps li.done { color: var(--deep); }
  .spinner { width: 16px; height: 16px; border: 1.5px solid var(--border); border-top-color: var(--deep); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .badge-ch { background: var(--mint); color: var(--deep); }
  .badge-strong { background: var(--mint); color: var(--deep); }
  .badge-moderate { background: var(--amber-light); color: var(--amber); }
  .badge-weak { background: var(--red-light); color: var(--red); }
  .badge-notrigger { background: var(--amber-light); color: var(--amber); }
  .touch-card { background: var(--warm-white); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .touch-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
  .touch-meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .angle-block { background: var(--mint); border-left: 3px solid var(--accent); padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 0 5px 5px 0; }
  .angle-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); margin-bottom: 4px; font-weight: 500; }
  .draft-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .draft-subject { font-size: 12px; color: var(--charcoal); margin-bottom: 8px; padding: 6px 10px; background: var(--sand); border-radius: 4px; border: 0.5px solid var(--border); font-family: 'DM Sans', sans-serif; }
  .draft-subject span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--stone); margin-right: 6px; }
  .draft-body { font-size: 13px; line-height: 1.75; color: var(--forest); white-space: pre-wrap; padding: 1rem; background: var(--sand); border-radius: 5px; border: 0.5px solid var(--border); font-family: 'DM Sans', sans-serif; }
  .gaps-toggle { font-size: 11px; color: var(--stone); cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 0; border: none; background: none; font-family: 'DM Sans', sans-serif; margin-top: 1rem; }
  .gaps-toggle:hover { color: var(--forest); }
  .gap-item { font-size: 12px; color: var(--sage); padding: 6px 0; border-bottom: 0.5px solid var(--border); line-height: 1.5; font-family: 'DM Sans', sans-serif; }
  .gap-item:last-child { border-bottom: none; }
  .acct-output-title { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; font-weight: 500; }
  .seq-pick { background: var(--warm-white); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 2rem; border-left: 3px solid var(--accent); }
  .seq-card { background: var(--warm-white); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  .seq-card-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .touch-num { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); font-weight: 500; }
  .touch-day-badge { font-size: 11px; background: var(--mint); border: 0.5px solid rgba(34,94,76,0.2); border-radius: 3px; padding: 2px 8px; color: var(--deep); font-weight: 500; }
  .touch-job { font-size: 12px; color: var(--sage); font-style: italic; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 0.5px solid var(--border); line-height: 1.5; }
  .guidance-block { background: var(--mint); border: 0.5px solid rgba(34,94,76,0.2); border-radius: 10px; padding: 1.25rem; margin-top: 2rem; }
  .guidance-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--deep); margin-bottom: 0.75rem; font-weight: 500; }
  .copy-ok { font-size: 11px; color: var(--deep); margin-left: 4px; font-weight: 500; }
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">Outreach Engine</span>
  <span class="topbar-powered">Powered by Budburst</span>
</div>
<div class="app" id="root"></div>
<script>
const S = {
  step: 0,
  handbookText: '', handbookFileName: '',
  accounts: Array.from({length:3}, () => ({
    name:'', website:'', trigger:'',
    prospects: Array.from({length:3}, () => ({
      name:'', role:'', buyerType:'',
      liText:'', liFileName:'', liMode:'paste',
      otherInfo:''
    }))
  })),
  outputs: [],
  seqProspect: null, seqOutput: null, seqGuidance: null, seqReason: '',
  seqLoading: false,
  progStep: 0,
  error: null,
  copiedId: null,
  gapsOpen: {},
  acctTab: 0
};

function R() { document.getElementById('root').innerHTML = build(); wire(); }

function build() {
  return `
    <div class="header">
      <div class="header-left">
        <div class="header-eyebrow">GTM Workshop</div>
        <h1 class="header-title">Outreach <em>Engine</em></h1>
        <p class="header-sub">Build research-grounded outreach for 9 prospects across 3 target accounts.</p>
      </div>
    </div>
    ${steps()}
    ${screen()}
  `;
}

function steps() {
  const labels = ['Handbook','Accounts','Generate','Touches','Sequence'];
  return `<div class="step-indicator">${['Setup','Accounts','Generate','Outputs','Sequence'].map((s,i) => `
    <div class="step-item">
      <div class="step-dot ${i<S.step?'done':i===S.step?'active':''}">${i<S.step?'&#10003;':i+1}</div>
      <div class="step-label ${i===S.step?'active':''}">${labels[i]}</div>
    </div>${i<4?'<div class="step-line"></div>':''}
  `).join('')}</div>`;
}

function screen() {
  if (S.step===0) return step0();
  if (S.step===1) return step1();
  if (S.step===2) return step2();
  if (S.step===3) return step3();
  if (S.step===4) return step4();
  return '';
}

function step0() {
  const has = !!S.handbookText;
  return `<div>
    <div class="section">
      <div class="section-title">GTM Positioning Handbook <span class="required-badge">Required</span></div>
      ${!has?`<div class="gate-warn">Your completed handbook is the engine of this tool. Every proof point, value claim, and ICP signal in your outreach will be drawn from it. Do not proceed without it.</div>`:''}
      <div class="field-group">
        <label>Upload handbook PDF or text file<span class="hint">The handbook you completed during Day One of the workshop.</span></label>
        <div class="file-upload ${has&&S.handbookFileName?'loaded':''}" onclick="document.getElementById('hf').click()">
          <input type="file" id="hf" accept=".pdf,.txt" style="display:none" />
          <span class="file-upload-lbl">${has&&S.handbookFileName?'&#10003; '+S.handbookFileName:'Click to upload PDF or text file'}</span>
        </div>
      </div>
      <div class="field-group">
        <label>Or paste handbook content directly<span class="hint">If you cannot upload a file, paste the full text here.</span></label>
        <textarea id="hpaste" rows="5" placeholder="Paste handbook content here...">${has&&!S.handbookFileName?S.handbookText:''}</textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="s0next" ${!has?'disabled':''}>Continue to Account Setup &rarr;</button>
      ${!has?`<span style="font-size:12px;color:var(--stone)">Upload or paste your handbook to continue</span>`:''}
    </div>
  </div>`;
}

function liInput(ai, pi) {
  const p = S.accounts[ai].prospects[pi];
  const mode = p.liMode || 'paste';
  const has = !!p.liText;
  const id = `li${ai}${pi}`;
  return `<div class="field-group">
    <label>LinkedIn profile content<span class="hint">Export as PDF (More > Save to PDF on their profile) or paste their About and Experience sections. Do not enter a URL.</span></label>
    <div class="linkedin-block">
      <div class="linkedin-tabs">
        <button class="li-tab ${mode==='paste'?'active':''}" data-limode="paste" data-ai="${ai}" data-pi="${pi}">Paste text</button>
        <button class="li-tab ${mode==='upload'?'active':''}" data-limode="upload" data-ai="${ai}" data-pi="${pi}">Upload PDF</button>
      </div>
      <div class="li-tab-body ${has?'loaded':''}">
        ${mode==='paste' ? `
          <textarea data-ai="${ai}" data-pi="${pi}" data-f="liText" rows="4" placeholder="Paste About section, experience with descriptions, any featured content...">${p.liText}</textarea>
          ${has?`<div class="loaded-indicator">&#10003; Content loaded</div>`:''}
        ` : `
          <div class="file-upload ${has?'loaded':''}" onclick="document.getElementById('${id}').click()">
            <input type="file" id="${id}" accept=".pdf,.txt" data-ai="${ai}" data-pi="${pi}" style="display:none" />
            <span class="file-upload-lbl">${p.liFileName?'&#10003; '+p.liFileName:'Click to upload LinkedIn PDF export'}</span>
          </div>
          ${!has?`<p style="font-size:11px;color:var(--ink-light);margin-top:6px;font-style:italic;">On LinkedIn: go to their profile, click More, then Save to PDF.</p>`:''}
          ${has?`<div class="loaded-indicator">&#10003; ${p.liFileName||'File loaded'}</div><button class="btn-clear" data-clearli="${ai}-${pi}">Remove file</button>`:''}
        `}
      </div>
    </div>
  </div>`;
}

function step1() {
  const a = S.accounts[S.acctTab];
  const ai = S.acctTab;
  const tabs = S.accounts.map((ac,i) => `<button class="nav-tab ${S.acctTab===i?'active':''}" data-acctab="${i}">Account ${i+1}${ac.name?': '+ac.name:''}</button>`).join('');
  const prospects = a.prospects.map((p,pi) => `
    <div class="prospect-block">
      <div class="prospect-hdr">Prospect ${pi+1}</div>
      <div class="field-row">
        <div class="field-group"><label>Full name</label><input type="text" data-ai="${ai}" data-pi="${pi}" data-f="name" value="${p.name}" placeholder="e.g. Sarah Chen" /></div>
        <div class="field-group"><label>Job title</label><input type="text" data-ai="${ai}" data-pi="${pi}" data-f="role" value="${p.role}" placeholder="e.g. Chief People Officer" /></div>
      </div>
      <div class="field-group">
        <label>Buyer role<span class="hint">How does this person fit the buying decision?</span></label>
        <select data-ai="${ai}" data-pi="${pi}" data-f="buyerType">
          <option value="" ${!p.buyerType?'selected':''}>Select buyer role...</option>
          <option value="Champion" ${p.buyerType==='Champion'?'selected':''}>Champion (feels the problem daily, drives internal buy-in)</option>
          <option value="Economic Buyer" ${p.buyerType==='Economic Buyer'?'selected':''}>Economic Buyer (controls budget, needs ROI framing)</option>
          <option value="Technical Influencer" ${p.buyerType==='Technical Influencer'?'selected':''}>Technical Influencer (evaluates fit, integration, security)</option>
          <option value="Executive Sponsor" ${p.buyerType==='Executive Sponsor'?'selected':''}>Executive Sponsor (strategic endorser, needs vision framing)</option>
          <option value="End User" ${p.buyerType==='End User'?'selected':''}>End User (uses the product, cares about usability)</option>
          <option value="Unknown" ${p.buyerType==='Unknown'?'selected':''}>Unknown</option>
        </select>
      </div>
      ${liInput(ai, pi)}
      <div class="field-group">
        <label>Additional prospect information (optional)<span class="hint">Company bio, conference profile, press mention, or anything else about this person.</span></label>
        <textarea data-ai="${ai}" data-pi="${pi}" data-f="otherInfo" rows="2" placeholder="Any other info about this specific person...">${p.otherInfo}</textarea>
      </div>
    </div>
  `).join('');
  function canGenCheck() {
    return S.accounts.some(ac =>
      ac.name && ac.website &&
      ac.prospects.some(p => p.name && p.role && p.buyerType)
    );
  }
  const canGen = canGenCheck();
  return `<div>
    <div class="section" style="margin-bottom:1rem;">
      <div class="section-title">Pre-work reminder</div>
      <p style="font-size:13px;color:var(--sage);line-height:1.6;">Identify 3 target accounts squarely in your ICP not yet prospected. For each account, identify 3 prospects covering different roles in the buying decision.</p>
    </div>
    <div class="nav-tabs">${tabs}</div>
    <div class="account-block">
      <div class="acct-header"><span>Account ${ai+1}</span>${a.name?`<span class="acct-header-name">${a.name}</span>`:''}</div>
      <div class="acct-body">
        <div class="field-row">
          <div class="field-group"><label>Company name <span style="color:var(--red)">*</span></label><input type="text" data-ai="${ai}" data-f="name" value="${a.name}" placeholder="e.g. Acme Corp" /></div>

    <div class="touch-hdr">

function step4() {

function seqTouch(t, i) {
  const chCls = t.channel==='LinkedIn'?'badge-strong':t.channel==='Phone'?'badge-moderate':'badge-ch';
  const key = `seq${i}`;
  const open = S.gapsOpen[key];
  const copyTxt = t.channel==='Email'?`Subject: ${t.subject||''}\n\n${t.draft||''}`:t.channel==='Phone'?`Voicemail:\n${t.voicemail||''}\n\nLive pickup:\n${t.livePickup||''}`:t.draft||'';
  let draftHtml = '';
  if (t.channel==='Email') draftHtml = `${t.subject?`<div class="draft-subject"><span>Subject:</span>${t.subject}</div>`:''}<div class="draft-body">${t.draft||''}</div>`;
  else if (t.channel==='Phone') draftHtml = `<div style="margin-bottom:10px"><div class="angle-lbl" style="margin-bottom:4px">Voicemail</div><div class="draft-body">${t.voicemail||''}</div></div><div><div class="angle-lbl" style="margin-bottom:4px">Live pickup</div><div class="draft-body">${t.livePickup||''}</div></div>`;
  else draftHtml = `<div class="draft-body">${t.draft||''}</div>`;
  return `<div class="seq-card">
    <div class="seq-card-hdr">
      <div style="display:flex;align-items:center;gap:8px"><span class="touch-num">Touch ${i+1}</span><span class="badge ${chCls}">${t.channel}</span></div>
      <span class="touch-day-badge">Day ${t.day}</span>
    </div>
    <div class="touch-job">${t.job||''}</div>
    <div>
      <div class="draft-lbl">
        <span>Draft</span>
        <button class="btn btn-copy" data-cp="${key}" data-cptxt="${encodeURIComponent(copyTxt)}">Copy${S.copiedId===key?' <span class="copy-ok">&#10003; Copied</span>':''}</button>
      </div>
      ${draftHtml}
    </div>
    ${t.gaps?`<button class="gaps-toggle" data-gaps="${key}">${open?'&#9660;':'&#9658;'} What would make this stronger</button>${open?`<div style="margin-top:8px"><div class="gap-item">${t.gaps}</div></div>`:''}`:''}
  </div>`;
}

function wire() {
  document.querySelectorAll('[data-acctab]').forEach(b => b.addEventListener('click', () => { S.acctTab=parseInt(b.dataset.acctab); R(); }));

  const hf = document.getElementById('hf');
  if (hf) hf.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    S.handbookFileName = f.name; S.handbookText = await f.text(); R();
  });
  const hp = document.getElementById('hpaste');
  if (hp) hp.addEventListener('input', e => {
    S.handbookText = e.target.value; S.handbookFileName = '';
    const b = document.getElementById('s0next'); if (b) b.disabled = !S.handbookText;
  });
  const s0n = document.getElementById('s0next');
  if (s0n) s0n.addEventListener('click', () => { S.step=1; R(); });
  const s1b = document.getElementById('s1back');
  if (s1b) s1b.addEventListener('click', () => { S.step=0; R(); });
  const s3b = document.getElementById('s3back');
  if (s3b) s3b.addEventListener('click', () => { S.step=1; R(); });
  const s4b = document.getElementById('s4back');
  if (s4b) s4b.addEventListener('click', () => { S.step=3; R(); });

  document.querySelectorAll('[data-limode]').forEach(b => b.addEventListener('click', () => {
    const ai=parseInt(b.dataset.ai), pi=parseInt(b.dataset.pi);
    S.accounts[ai].prospects[pi].liMode = b.dataset.limode; R();
  }));

  document.querySelectorAll('[data-clearli]').forEach(b => b.addEventListener('click', () => {
    const [ai,pi] = b.dataset.clearli.split('-').map(Number);
    S.accounts[ai].prospects[pi].liText=''; S.accounts[ai].prospects[pi].liFileName=''; R();
  }));

  for (let ai=0;ai<3;ai++) for (let pi=0;pi<3;pi++) {
    const lif = document.getElementById(`li${ai}${pi}`);
    if (lif) {
      const _ai=ai, _pi=pi;
      lif.addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        S.accounts[_ai].prospects[_pi].liFileName = f.name;
        S.accounts[_ai].prospects[_pi].liText = await f.text();
        R();
      });
    }
  }

  document.querySelectorAll('[data-ai][data-f]:not([data-pi])').forEach(el => {
    el.addEventListener('input', () => {
      S.accounts[el.dataset.ai][el.dataset.f] = el.value;
      if (el.dataset.f==='name') {
        document.querySelectorAll('[data-acctab]').forEach((tab, i) => {
          const ac = S.accounts[i];
          tab.textContent = 'Account ' + (i+1) + (ac.name ? ': ' + ac.name : '');
        });
        const genBtn = document.getElementById('s1gen');
        const hint = document.getElementById('s1hint');
        const valid = canGenCheck();
        if (genBtn) genBtn.disabled = !valid;
        if (hint) hint.style.display = valid ? 'none' : 'inline';
      }
    });
  });
  document.querySelectorAll('[data-ai][data-pi][data-f]').forEach(el => {
    const h = () => { S.accounts[el.dataset.ai].prospects[el.dataset.pi][el.dataset.f] = el.value; };
    el.addEventListener('input', h); el.addEventListener('change', h);
  });

  const s1g = document.getElementById('s1gen');
  if (s1g) s1g.addEventListener('click', () => { S.step=2; S.progStep=0; S.error=null; R(); generate(); });
  const s2r = document.getElementById('s2retry');
  if (s2r) s2r.addEventListener('click', () => { S.step=2; S.progStep=0; S.error=null; R(); generate(); });
  const s3s = document.getElementById('s3seq');
  if (s3s) s3s.addEventListener('click', () => { S.step=4; S.seqLoading=true; S.error=null; R(); runSeq(); });
  const s4r = document.getElementById('s4retry');
  if (s4r) s4r.addEventListener('click', () => { S.seqLoading=true; S.error=null; R(); runSeq(); });

  document.querySelectorAll('[data-cp]').forEach(b => b.addEventListener('click', () => {
    const txt = decodeURIComponent(b.dataset.cptxt);
    navigator.clipboard.writeText(txt).then(() => { S.copiedId=b.dataset.cp; R(); setTimeout(()=>{S.copiedId=null;R();},2000); });
  }));
  document.querySelectorAll('[data-gaps]').forEach(b => b.addEventListener('click', () => { S.gapsOpen[b.dataset.gaps]=!S.gapsOpen[b.dataset.gaps]; R(); }));

  const s3ex = document.getElementById('s3export'); if (s3ex) s3ex.addEventListener('click', exportTouches);
  const s4ex = document.getElementById('s4export'); if (s4ex) s4ex.addEventListener('click', exportSeq);
}

async function aiCall(prompt) {
  const ivl = [900,1500,2200,3100,4200,5500]; let idx=0;
  const tmr = setInterval(() => { if (idx<6){S.progStep=idx;R();idx++;} }, ivl[idx]||1500);
  try {
    const res = await fetch('/.netlify/functions/proxy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:8000, messages:[{role:'user',content:prompt}] })
    });
    clearInterval(tmr); S.progStep=6; R();
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || `API error ${res.status}`);
    }
    const d = await res.json();
    return d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  } catch(e) { clearInterval(tmr); throw e; }
}

async function generate() {
  try {
    const txt = await aiCall(genPrompt());
    S.outputs = parseArr(txt); S.step=3; R();
  } catch(e) { S.error=`Generation failed: ${e.message}. Check your inputs and try again.`; R(); }
}

function genPrompt() {
  const accts = S.accounts
    .filter(a => a.name && a.website && a.prospects.some(p => p.name && p.role && p.buyerType))
    .map((a,ai) => {
      const ps = a.prospects
        .filter(p => p.name && p.role && p.buyerType)
        .map((p,pi) => `
PROSPECT ${pi+1}:
Name: ${p.name}
Title: ${p.role}
Buyer Role: ${p.buyerType}
LinkedIn/Profile: ${p.liText||'Not provided'}
Additional Info: ${p.otherInfo||'None'}`).join('\n');
      return `ACCOUNT ${ai+1}: ${a.name}
Website: ${a.website}
Trigger: ${a.trigger||'NONE PROVIDED - flag as gap in all outputs for this account'}
${ps}`;
    }).join('\n---\n');

  return `You are an expert B2B sales coach helping founders craft personalized cold outreach. Work ONLY from the source materials provided. Do not infer, assume, or add anything not explicitly in the sources.

SOURCE 1 - GTM POSITIONING HANDBOOK:
${S.handbookText}

SOURCE 2 - ACCOUNTS AND PROSPECTS:
${accts}

INSTRUCTIONS:
For each of the 9 prospects produce one personalized outreach touch. Prospects at the same account must NOT receive the same angle, proof point, or opening line. Use the buyer role and handbook persona guidance to differentiate angles.

Silently perform this analysis per prospect (do NOT include in output):
- What does the handbook say about this buyer type and what they care about?
- What does the prospect profile reveal about their background and priorities?
- Is there a live timing trigger? How strong?
- What is the single strongest angle at the intersection of handbook pain and this person's specific situation?
- What channel fits best?
- What is the overall signal strength?

Return ONLY a JSON array of 9 objects. No preamble, no explanation, no markdown fences:

[
  {
    "accountName": "string",
    "prospectName": "string",
    "prospectRole": "string",
    "buyerType": "string",
    "channel": "Email" or "LinkedIn",
    "hasTrigger": true or false,
    "signalStrength": "Strong" or "Moderate" or "Weak",
    "angle": "one sentence: the outreach angle and why it fits this person specifically",
    "subject": "email subject max 8 words no dashes, omit if LinkedIn",
    "draft": "the full email or LinkedIn message body",
    "gaps": ["specific gap with impact and what to find", "gap 2", "gap 3"]
  }
]

STRICT RULES:
- No em dashes or en dashes anywhere. Rewrite any sentence requiring one.
- No 'following up', 'just wanted to', 'hope this finds you well'
- Email opening: not company name, not a compliment, not 'I wanted to reach out'. Opens on something true about their world drawn from the sources.
- Email body: 3-5 sentences max. Problem or trigger first. Outcome not feature. One proof point from handbook only.
- Email closing: one question only. No meeting ask.
- LinkedIn: max 4 sentences. More direct. Different angle from any email at same account.
- Subject: max 8 words, specific not clever, no dashes of any kind.
- Tone: sharp, human, slightly casual. No throat-clearing. Every sentence earns its place.
- All proof points from handbook only. Do not invent metrics.
- Prospects at same account must have meaningfully different angles and openings.

Return only the JSON array.`;
}

function parseArr(raw) {
  const c = raw.replace(/\`\`\`json/g,'').replace(/\`\`\`/g,'').trim();
  const s=c.indexOf('['), e=c.lastIndexOf(']');
  if (s===-1||e===-1) throw new Error('No JSON array found in response');
  return JSON.parse(c.slice(s,e+1));
}

async function runSeq() {
  try {
    const best = pickBest();
    S.seqProspect = best;
    S.seqReason = best.reason;
    const res = await fetch('/.netlify/functions/proxy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:16000, messages:[{role:'user',content:seqPrompt(best)}] })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || `API error ${res.status}`);
    }
    const d = await res.json();
    const txt = d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const parsed = parseObj(txt);
    S.seqOutput = parsed.touches; S.seqGuidance = parsed.guidance;
    S.seqLoading = false; R();
  } catch(e) { S.error=`Sequence failed: ${e.message}`; S.seqLoading=false; R(); }
}

function pickBest() {
  const scored = S.outputs.map(o => {
    let sc=0;
    if (o.signalStrength==='Strong') sc+=3; else if (o.signalStrength==='Moderate') sc+=1;
    if (o.hasTrigger) sc+=2;
    const ac = S.accounts.find(a=>a.name===o.accountName);
    if (ac) {
      const p = ac.prospects.find(p=>p.name===o.prospectName);
      if (p&&p.liText&&p.liText.length>100) sc+=1;
      if (ac.trigger&&ac.trigger.length>50) sc+=1;
    }
    return {...o, sc, acctData:ac, pData:ac?ac.prospects.find(p=>p.name===o.prospectName):null};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const b = scored[0];
  b.reason = `${b.prospectName} at ${b.accountName} was selected based on ${b.signalStrength.toLowerCase()} signal strength${b.hasTrigger?', a live timing trigger':''}, and the depth of available source material. A richer source base produces a more credible and differentiated sequence.`;
  return b;
}

function seqPrompt(p) {
  const ac = p.acctData; const pd = p.pData;
  return `You are an expert B2B sales coach. Build a full 8-touch, 21-day outreach sequence. Work ONLY from the sources provided.

SOURCE 1 - GTM HANDBOOK:
${S.handbookText}

SOURCE 2 - PROSPECT:
Name: ${p.prospectName}
Title: ${p.prospectRole}
Buyer Role: ${p.buyerType}
Company: ${p.accountName}
Website: ${ac?ac.website:''}
Trigger: ${ac&&ac.trigger?ac.trigger:'None'}
LinkedIn: ${pd?(pd.liText||'Not provided'):'Not provided'}
Other info: ${pd?(pd.otherInfo||'None'):'None'}
Initial angle: ${p.angle}

SEQUENCE: Touch 1 Email Day 1, Touch 2 LinkedIn Day 3, Touch 3 Email Day 5, Touch 4 Phone Day 7, Touch 5 Email Day 10, Touch 6 LinkedIn Day 14, Touch 7 Phone Day 17, Touch 8 Email Day 21.

RULES:
- Each touch delivers something new. No restatement.
- Progress through: problem depth, social proof, perspective shift.
- No touch references a previous touch. Each stands alone.
- Touch 8: clean low-pressure close-out. No guilt, no false urgency.
- No em dashes or en dashes anywhere.
- No 'following up', 'just wanted to', 'hope this finds you well'
- Emails: subject max 8 words no dashes, opening not company name or compliment, body 3-5 sentences, one question close, no meeting ask touches 1-3.
- LinkedIn: max 4 sentences, more direct than emails.
- Phone: voicemail max 3 sentences AND live pickup (one sentence to earn 30 seconds then one question).
- All proof points from handbook only.
- Tone: sharp, human, slightly casual. Every sentence earns its place.

Return ONLY a JSON object, no preamble, no markdown:

{
  "touches": [
    {
      "channel": "Email" or "LinkedIn" or "Phone",
      "day": number,
      "job": "one sentence: what this touch accomplishes that previous did not",
      "subject": "for emails only",
      "draft": "email or LinkedIn body",
      "voicemail": "for phone only",
      "livePickup": "for phone only",
      "gaps": "one sentence on what would strengthen this touch, or null"
    }
  ],
  "guidance": "3-5 sentences on how to think about sequencing the other 8 prospects, referencing specific prospects or accounts where possible."
}`;
}

function parseObj(raw) {
  const c = raw.replace(/\`\`\`json/g,'').replace(/\`\`\`/g,'').trim();
  const s=c.indexOf('{'), e=c.lastIndexOf('}');
  if (s===-1) throw new Error('No JSON in sequence output');
  return JSON.parse(c.slice(s,e+1));
}

function exportTouches() {
  let out = 'OUTREACH WORKSHOP: 9 INITIAL TOUCHES\n'+'='.repeat(60)+'\n\n';
  const by={};
  S.outputs.forEach(o=>{if(!by[o.accountName])by[o.accountName]=[];by[o.accountName].push(o);});
  Object.entries(by).forEach(([name,ts])=>{
    out+=`ACCOUNT: ${name}\n${'_'.repeat(40)}\n\n`;
    ts.forEach(t=>{
      out+=`PROSPECT: ${t.prospectName} | ${t.prospectRole} | ${t.buyerType}\n`;
      out+=`CHANNEL: ${t.channel} | SIGNAL: ${t.signalStrength}${!t.hasTrigger?' | NO TIMING SIGNAL':''}\n`;
      out+=`ANGLE: ${t.angle}\n\n`;
      if(t.channel==='Email') out+=`SUBJECT: ${t.subject}\n\n`;
      out+=`DRAFT:\n${t.draft}\n\n`;
      if(t.gaps&&t.gaps.length) out+=`GAPS:\n${t.gaps.map((g,i)=>`${i+1}. ${g}`).join('\n')}\n`;
      out+='\n'+'-'.repeat(40)+'\n\n';
    });
  });
  dl(out,'outreach-touches.txt');
}

function exportSeq() {
  if(!S.seqOutput) return;
  const sp=S.seqProspect;
  let out=`FULL OUTREACH SEQUENCE\nProspect: ${sp.prospectName} at ${sp.accountName}\n${sp.reason}\n${'='.repeat(60)}\n\n`;
  S.seqOutput.forEach((t,i)=>{
    out+=`TOUCH ${i+1} | ${t.channel} | Day ${t.day}\nJob: ${t.job}\n\n`;
    if(t.channel==='Email') out+=`Subject: ${t.subject}\n\n${t.draft}\n`;
    else if(t.channel==='Phone') out+=`Voicemail:\n${t.voicemail}\n\nLive pickup:\n${t.livePickup}\n`;
    else out+=`${t.draft}\n`;
    if(t.gaps) out+=`\nWhat would strengthen this: ${t.gaps}\n`;
    out+='\n'+'-'.repeat(40)+'\n\n';
  });
  if(S.seqGuidance) out+=`GUIDANCE FOR OTHER PROSPECTS:\n${S.seqGuidance}\n`;
  dl(out,'full-sequence.txt');
}

function dl(content, filename) {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));
  a.download=filename; a.click();
}

R();
</script>
